services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1
    volumes:
      - ./ha-debug-config:/config
      - ./dev/configuration.yaml:/config/configuration.yaml:ro
      - ./custom_components:/config/custom_components:ro
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:5678:5678"
    environment:
      - TZ=Australia/Sydney
    restart: "no"
