name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v10.3.2
      with:
        version: '0.13.7'
        enable-cache: true
    - name: Install current Home Assistant and test dependencies
      run: uv sync --locked
    - name: Check dependency compatibility
      run: uv pip check
    - name: Check Python types
      run: uv run --frozen pyright
    - name: Run regression and Marketplace tests
      run: uv run --frozen pytest
    - name: Check Python syntax
      run: uv run --frozen python -m compileall -q custom_components scripts tests discover.py
    - name: Build release archives
      run: uv run --frozen python scripts/build_release.py

  hassfest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: home-assistant/actions/hassfest@master

  marketplace:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: hacs/action@main
      with:
        category: integration
        comment: false
