name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        default: v1.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag || github.ref }}
    - uses: astral-sh/setup-uv@v10.3.2
      with:
        version: '0.13.7'
        enable-cache: true
    - name: Install test dependencies
      run: uv sync --locked
    - name: Verify dependencies and regression tests
      run: |
        uv pip check
        uv run --frozen pytest
    - name: Build and check release version
      env:
        RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      run: uv run --frozen python scripts/build_release.py --tag "$RELEASE_TAG"
    - name: Publish GitHub release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ inputs.tag || github.ref_name }}
        body_path: CHANGELOG.md
        files: |
          dist/delonghi_comfort.zip
          dist/delonghi-comfort-integration-v*.zip
        fail_on_unmatched_files: true
        draft: false
        prerelease: false
        make_latest: true
        generate_release_notes: true
